<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Sky Max IPTV</title>
  <!-- ÍCONE DO SITE -->
  <link rel="icon" type="image/png" href="https://raw.githubusercontent.com/airtoncavalcante-dev/Sky-Max-IPTV/main/img/icone-iptv2.png">
  <link rel="apple-touch-icon" href="https://raw.githubusercontent.com/airtoncavalcante-dev/Sky-Max-IPTV/main/img/icone-iptv2.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="site-wrapper">
    <header class="header">
      <h1 class="title">Sky Max IPTV</h1>
      <p class="subtitle">Os melhores canais de TV em um só lugar.</p>
    </header>

    <!-- Botão Controle -->
    <div id="drawerTrigger" title="Abrir canais">
      <img src="https://raw.githubusercontent.com/airtoncavalcante-dev/Sky-Max-IPTV/main/img/Controle-sem-fundo.png" alt="Controle" onerror="this.style.display='none'; this.nextElementSibling.style.display='block'">
      <span style="display:none; font-size:32px;">🎮</span>
      <span class="pulse"></span>
    </div>

    <!-- Gaveta -->
    <aside id="channelDrawer">
      <div class="drawer-header">
        <span>CANAIS DE VOLTA</span>
        <button id="closeDrawer">✕</button>
      </div>
      <div class="drawer-list" id="channelList"></div>
      <div class="drawer-footer">Toque para assistir • Fecha em 5s</div>
    </aside>

    <div id="overlay"></div>

    <main id="mainPlayer">
      <div id="playerArea">
        <div id="playerPlaceholder">
          <span>Selecione um canal</span>
          <small>Toque no controle à esquerda</small>
        </div>
        <iframe id="playerFrame" name="Player" src="" frameborder="0" height="400" width="640" scrolling="no" allow="encrypted-media" allowfullscreen></iframe>
      </div>
      <div id="nowPlaying">Nenhum canal selecionado</div>
    </main>

    <footer class="footer">
      <p>&copy; Desenvolvido por Cavalcante Tecnology - 2026</p>
    </footer>
  </div>

<script>
const channels = [
  { num: 4,   name: 'SBT',             id: 'sbt',      src: 'https://alerquina54102.embedtv.lat/sbt' },
  { num: 5,   name: 'GLOBO',           id: 'globo',    src: 'https://redecanaistv.af/player3/ch.php?canal=bobonordeste' },
  { num: 7,   name: 'RECORD',          id: 'record',   src: 'https://redecanaistv.golf/player3/ch.php?categoria=live&canal=record' },
  { num: 36,  name: 'SporTV',          id: 'sportv',   src: 'https://alerquina54102.embedtv.lat/sportv' },
  { num: 110, name: 'Space',           id: 'space',    src: 'https://alerquina54102.embedtv.lat/space' },
  { num: 139, name: 'Warner Channel',  id: 'warner',   src: 'https://alerquina54102.embedtv.lat/warnerchannel' },
  { num: 230, name: 'Premiere',        id: 'premiere', src: 'https://alerquina54102.embedtv.lat/premiere' },
  { num: 270, name: 'Sexy Hot',        id: 'sexyhot',  src: 'https://alerquina54102.embedtv.lat/sexyhot' },
  { num: 272, name: 'Playboy TV',      id: 'playboy',  src: 'https://v4.rde.lat/playboytv' },
];

const drawer = document.getElementById('channelDrawer');
const trigger = document.getElementById('drawerTrigger');
const overlay = document.getElementById('overlay');
const closeBtn = document.getElementById('closeDrawer');
const listEl = document.getElementById('channelList');
const frame = document.getElementById('playerFrame');
const placeholder = document.getElementById('playerPlaceholder');
const nowPlaying = document.getElementById('nowPlaying');

let autoCloseTimer = null;

function renderList(){
  listEl.innerHTML = channels.map(ch => `
    <div class="channel-row" data-id="${ch.id}">
      <span class="ch-num">${ch.num}</span>
      <span class="ch-name">${ch.name}</span>
    </div>
  `).join('');
  listEl.querySelectorAll('.channel-row').forEach(row => {
    row.addEventListener('click', () => selectChannel(row.dataset.id));
  });
}

function openDrawer(){
  drawer.classList.add('open');
  overlay.classList.add('show');
  resetAutoClose();
}
function closeDrawer(){
  drawer.classList.remove('open');
  overlay.classList.remove('show');
  clearTimeout(autoCloseTimer);
}
function resetAutoClose(){
  clearTimeout(autoCloseTimer);
  autoCloseTimer = setTimeout(closeDrawer, 5000); // 5 SEGUNDOS
}

function selectChannel(id){
  const ch = channels.find(c => c.id === id);
  if(!ch) return;
  listEl.querySelectorAll('.channel-row').forEach(r => r.classList.remove('active'));
  listEl.querySelector(`[data-id="${id}"]`).classList.add('active');

  placeholder.style.display = 'none';
  frame.style.display = 'block';
  frame.src = ch.src;
  nowPlaying.textContent = `${ch.num} - ${ch.name} - AO VIVO`;
  nowPlaying.classList.add('live');

  setTimeout(closeDrawer, 1500);
}

trigger.addEventListener('click', (e) => {
  e.stopPropagation();
  if(drawer.classList.contains('open')) closeDrawer();
  else openDrawer();
});
closeBtn.addEventListener('click', closeDrawer);
overlay.addEventListener('click', closeDrawer);

// Reseta timer ao interagir
drawer.addEventListener('mousemove', resetAutoClose);
drawer.addEventListener('touchstart', resetAutoClose, {passive:true});
drawer.addEventListener('scroll', resetAutoClose, {passive:true});

renderList();
window.addEventListener('load', () => {
  openDrawer();
  setTimeout(closeDrawer, 4000);
});
</script>
</body>
</html>
